services:
  hunt-vault:
    build:
      context: .
      dockerfile: dockerfile
    image: hunt-vault:local
    init: true
    restart: on-failure:10
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      DATABASE_PATH: /app/data/hunt-vault.db
      STATIC_DIR: /app/client
      GIN_MODE: release
      SYNC_API_KEY: "${SYNC_API_KEY:?Defina SYNC_API_KEY no arquivo .env ou no ambiente}"
    volumes:
      - hunt-vault-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  hunt-vault-data:
